<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Verification</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .gh-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gh-logo {
      width: 40px;
      height: 40px;
      fill: #f0f6fc;
    }

    .gh-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #f0f6fc;
      margin-bottom: 16px;
      text-align: center;
    }

    .gh-card {
      width: 100%;
      max-width: 360px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 20px;
    }

    .gh-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 16px;
      text-align: center;
    }

    .turnstile-box {
      display: flex;
      justify-content: center;
      min-height: 65px;
      margin-bottom: 14px;
    }

    .status-msg {
      font-size: 12px;
      text-align: center;
      color: #8b949e;
      margin-bottom: 16px;
      min-height: 18px;
    }

    .status-msg.success {
      color: #3fb950;
    }

    .status-msg.error {
      color: #f85149;
    }

    .btn-blue {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1f6feb;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-blue:hover:not(:disabled) {
      background-color: #388bfd;
    }

    .btn-blue:active:not(:disabled) {
      background-color: #1158c7;
    }

    .btn-blue:disabled {
      background-color: #21262d;
      color: #484f58;
      border-color: #30363d;
      cursor: not-allowed;
    }

    .gh-footer {
      width: 100%;
      max-width: 360px;
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
    }

    .gh-footer span {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="gh-header">
    <svg class="gh-logo" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
    </svg>
  </div>

  <h1 class="gh-title">Verify your session</h1>

  <main class="gh-card">
    <p class="gh-desc">Complete the security check below to continue to the repository page.</p>

    <div class="turnstile-box">
      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAGIurRXZpSv1R-eO"
        data-theme="dark"
        data-callback="onVerified"
        data-expired-callback="onExpired"
        data-error-callback="onVerifyError"
      ></div>
    </div>

    <div id="status-msg" class="status-msg">Waiting for human verification...</div>

    <button id="continue-btn" class="btn-blue" type="button" disabled>Continue</button>
  </main>

  <footer class="gh-footer">
    Protected by <span>Cloudflare Turnstile</span>
  </footer>

  <script>
    const TARGET_URL = "https://justonecom.github.io/Tiktokyo-2.0/";
    const statusMsg = document.getElementById("status-msg");
    const continueBtn = document.getElementById("continue-btn");
    let verifiedToken = "";

    function onVerified(token) {
      verifiedToken = token;
      statusMsg.textContent = "Verification complete. Click Continue to proceed.";
      statusMsg.className = "status-msg success";
      continueBtn.disabled = false;
    }

    function onExpired() {
      verifiedToken = "";
      statusMsg.textContent = "Verification expired. Please verify again.";
      statusMsg.className = "status-msg error";
      continueBtn.disabled = true;
    }

    function onVerifyError() {
      verifiedToken = "";
      statusMsg.textContent = "Verification failed. Check your registered domain.";
      statusMsg.className = "status-msg error";
      continueBtn.disabled = true;
    }

    continueBtn.addEventListener("click", () => {
      if (!verifiedToken) return;
      continueBtn.textContent = "Redirecting...";
      continueBtn.disabled = true;
      window.location.href = TARGET_URL;
    });
  </script>
</body>
</html>
