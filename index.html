<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify & Sign in with Gmail</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .gh-header {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gh-logo {
      width: 38px;
      height: 38px;
      fill: #f0f6fc;
    }

    .gh-title {
      font-size: 21px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #f0f6fc;
      margin-bottom: 16px;
      text-align: center;
    }

    .gh-card {
      width: 100%;
      max-width: 360px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 20px;
    }

    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 8px;
    }

    .gh-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 14px;
    }

    .turnstile-box {
      display: flex;
      justify-content: center;
      min-height: 65px;
      margin-bottom: 14px;
    }

    .divider {
      border: 0;
      border-top: 1px solid #30363d;
      margin: 16px 0;
    }

    .google-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .gmail-badge {
      display: none;
      width: 100%;
      padding: 8px 10px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 12px;
      color: #3fb950;
      word-break: break-all;
      text-align: center;
    }

    .status-msg {
      font-size: 12px;
      text-align: center;
      color: #8b949e;
      margin-bottom: 14px;
      min-height: 18px;
    }

    .status-msg.success {
      color: #3fb950;
    }

    .status-msg.error {
      color: #f85149;
    }

    .btn-blue {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1f6feb;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-blue:hover:not(:disabled) {
      background-color: #388bfd;
    }

    .btn-blue:active:not(:disabled) {
      background-color: #1158c7;
    }

    .btn-blue:disabled {
      background-color: #21262d;
      color: #484f58;
      border-color: #30363d;
      cursor: not-allowed;
    }

    .gh-footer {
      width: 100%;
      max-width: 360px;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
    }

    .gh-footer span {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="gh-header">
    <svg class="gh-logo" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
    </svg>
  </div>

  <h1 class="gh-title">Verify & Sign in with Gmail</h1>

  <main class="gh-card">
    <div class="step-label">1. Human Verification</div>
    <p class="gh-desc">Complete the Cloudflare security check first.</p>

    <div class="turnstile-box">
      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAGIurRXZpSv1R-eO"
        data-theme="dark"
        data-callback="onHumanVerified"
        data-expired-callback="onHumanExpired"
        data-error-callback="onHumanError"
      ></div>
    </div>

    <hr class="divider" />

    <div class="step-label">2. Gmail Account</div>
    <p class="gh-desc">Sign in with your Gmail account to continue.</p>

    <div class="google-box">
      <div
        id="g_id_onload"
        data-client_id="794756938-hr1g57b68e7r4iapiqqmmqe4a82ck7cu.apps.googleusercontent.com"
        data-callback="onGoogleCredential"
        data-auto_prompt="false"
      ></div>
      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="filled_blue"
        data-text="signin_with"
        data-shape="rectangular"
        data-logo_alignment="left"
      ></div>
      <div id="gmail-badge" class="gmail-badge"></div>
    </div>

    <div id="status-msg" class="status-msg">Complete human check and Gmail sign-in.</div>

    <button id="continue-btn" class="btn-blue" type="button" disabled>Continue</button>
  </main>

  <footer class="gh-footer">
    <span>GitHub Style</span> • <span>Cloudflare Turnstile</span> • <span>Google Sign-In</span>
  </footer>

  <script>
    const TARGET_URL = "https://justonecom.github.io/Tiktokyo-2.0/";
    const statusMsg = document.getElementById("status-msg");
    const continueBtn = document.getElementById("continue-btn");
    const gmailBadge = document.getElementById("gmail-badge");

    let humanOk = false;
    let gmailEmail = "";

    function parseJwtPayload(token) {
      const base64Url = token.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split("")
          .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      );
      return JSON.parse(jsonPayload);
    }

    function updateReadyState() {
      if (humanOk && gmailEmail) {
        statusMsg.textContent = "Ready. Click Continue to open the destination.";
        statusMsg.className = "status-msg success";
        continueBtn.disabled = false;
      } else if (humanOk && !gmailEmail) {
        statusMsg.textContent = "Human check passed. Please sign in with Gmail.";
        statusMsg.className = "status-msg";
        continueBtn.disabled = true;
      } else if (!humanOk && gmailEmail) {
        statusMsg.textContent = "Gmail signed in. Complete human verification.";
        statusMsg.className = "status-msg";
        continueBtn.disabled = true;
      } else {
        statusMsg.textContent = "Complete human check and Gmail sign-in.";
        statusMsg.className = "status-msg";
        continueBtn.disabled = true;
      }
    }

    function onHumanVerified(token) {
      humanOk = Boolean(token);
      updateReadyState();
    }

    function onHumanExpired() {
      humanOk = false;
      updateReadyState();
    }

    function onHumanError() {
      humanOk = false;
      statusMsg.textContent = "Human verification failed. Check your domain and connection.";
      statusMsg.className = "status-msg error";
      continueBtn.disabled = true;
    }

    function onGoogleCredential(response) {
      try {
        const profile = parseJwtPayload(response.credential);
        gmailEmail = profile.email || "Google Account";
        gmailBadge.textContent = "Signed in: " + gmailEmail;
        gmailBadge.style.display = "block";
        updateReadyState();
      } catch (e) {
        gmailEmail = "";
        statusMsg.textContent = "Unable to read Gmail account info.";
        statusMsg.className = "status-msg error";
        continueBtn.disabled = true;
      }
    }

    continueBtn.addEventListener("click", () => {
      if (!humanOk || !gmailEmail) return;
      continueBtn.textContent = "Redirecting...";
      continueBtn.disabled = true;
      window.location.href = TARGET_URL;
    });
  </script>
</body>
</html>
